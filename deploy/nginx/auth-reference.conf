# Standalone local reference, NOT an enabled production deployment.
# Direct-edge assumption: no upstream load balancer / CDN / real_ip_header.
worker_processes auto;
events { worker_connections 1024; }
http {
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /var/log/nginx/access.log safe;
    limit_req_zone $binary_remote_addr zone=auth_login_per_ip:10m rate=5r/m;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        client_max_body_size 8k;
        proxy_set_header Host $host;
        # Replace client-supplied identity headers, never append untrusted values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";

        location = /api/v1/auth/login {
            # No burst: 5 requests/minute, spaced about 12 seconds apart.
            limit_req zone=auth_login_per_ip;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
        }
        location = /api/v1/auth/login/ {
            return 308 /api/v1/auth/login;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
